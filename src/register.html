<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - MyUmsu</title>
    <link href="../asset/css/style.css" rel="stylesheet" />
    <link href="../asset/tailwind.css" rel="stylesheet" />
  </head>

  <body>
    <div
      class="flex min-h-screen items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden"
    >
      <div
        class="absolute bottom-0 md:block hidden left-0 ml-16 mb-16 text-blue-600 z-20"
      >
        <img src="../asset/images/tree-3.png" alt="logo" />
      </div>

      <div
        class="absolute bottom-0 md:block hidden right-0 mr-16 mb-16 text-blue-700 z-20"
      >
        <img src="../asset/images/tree.png" alt="logo" />
      </div>

      <div class="absolute md:block hidden bottom-[-2rem] left-0 w-full z-10">
        <img
          src="../asset/images/auth-basic-mask-light.png"
          alt="Decorative background"
          class="w-full"
        />
      </div>

      <div
        class="w-full max-w-lg space-y-8 px-12 py-12 bg-white rounded-sm shadow-2xl z-50 animate-slide-up"
      >
        <div class="text-center">
          <div class="mx-auto h-22 w-22 mb-12 text-blue-600" aria-hidden="true">
            <img src="../asset/images/logo-umsu.png" alt="logo" />
          </div>

          <h2 class="mt-4 md:text-2xl text-xl font-semibold text-gray-900">
            Buat Akun <span class="text-blue-600">MyUmsu</span>
          </h2>

          <p class="mt-2 text-sm text-gray-600">
            Silakan isi data untuk mendaftar.
          </p>
        </div>

        <form class="mt-8 space-y-6" method="POST" action="#">
          <div class="space-y-4">
            <div class="relative">
              <input
                id="fullname"
                name="fullname"
                type="text"
                required
                placeholder=" "
                class="peer block w-full rounded-lg border border-gray-300 px-4 py-3 text-gray-900 focus:border-blue-500 focus:border-2 focus:outline-none"
              />
              <label
                for="fullname"
                class="absolute left-4 top-3 text-gray-500 bg-white px-1 transition-all duration-200 pointer-events-none peer-placeholder-shown:top-3 peer-placeholder-shown:text-base peer-focus:top-[-0.5rem] peer-focus:text-xs peer-focus:text-blue-500 peer-not-placeholder-shown:top-[-0.5rem] peer-not-placeholder-shown:text-xs"
              >
                Nama Lengkap
              </label>
            </div>

            <div class="relative">
              <input
                id="email"
                name="email"
                type="email"
                required
                placeholder=" "
                class="peer block w-full rounded-lg border border-gray-300 px-4 py-3 text-gray-900 focus:border-blue-500 focus:border-2 focus:outline-none"
              />
              <label
                for="email"
                class="absolute left-4 top-3 text-gray-500 bg-white px-1 transition-all duration-200 pointer-events-none peer-placeholder-shown:top-3 peer-placeholder-shown:text-base peer-focus:top-[-0.5rem] peer-focus:text-xs peer-focus:text-blue-500 peer-not-placeholder-shown:top-[-0.5rem] peer-not-placeholder-shown:text-xs"
              >
                Email
              </label>
            </div>

            <div class="relative">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder=" "
                required
                class="peer block w-full rounded-lg border border-gray-300 px-4 py-3 text-gray-900 focus:border-blue-500 focus:border-2 focus:outline-none"
              />

              <div
                id="togglePasswordIcon"
                class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 cursor-pointer"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  fill="currentColor"
                  class="bi bi-eye"
                  viewBox="0 0 16 16"
                >
                  <path
                    d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"
                  />
                  <path
                    d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"
                  />
                </svg>
              </div>

              <label
                for="password"
                class="absolute left-4 top-3 text-gray-500 bg-white px-1 transition-all duration-200 pointer-events-none peer-placeholder-shown:top-3 peer-placeholder-shown:text-base peer-focus:top-[-0.5rem] peer-focus:text-xs peer-not-placeholder-shown:top-[-0.5rem] peer-not-placeholder-shown:text-xs peer-focus:text-blue-500"
              >
                Password
              </label>
            </div>
            <div class="relative">
              <input
                id="confirm_password"
                name="confirm_password"
                type="password"
                autocomplete="current-password"
                placeholder=" "
                required
                class="peer block w-full rounded-lg border border-gray-300 px-4 py-3 text-gray-900 focus:border-blue-500 focus:border-2 focus:outline-none"
              />

              <div
                id="toggleConfirmPasswordIcon"
                class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 cursor-pointer"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  fill="currentColor"
                  class="bi bi-eye"
                  viewBox="0 0 16 16"
                >
                  <path
                    d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"
                  />
                  <path
                    d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"
                  />
                </svg>
              </div>

              <label
                for="password"
                class="absolute left-4 top-3 text-gray-500 bg-white px-1 transition-all duration-200 pointer-events-none peer-placeholder-shown:top-3 peer-placeholder-shown:text-base peer-focus:top-[-0.5rem] peer-focus:text-xs peer-not-placeholder-shown:top-[-0.5rem] peer-not-placeholder-shown:text-xs peer-focus:text-blue-500"
              >
                Password
              </label>
            </div>
          </div>

          <div>
            <button
              type="submit"
              class="group relative flex w-full justify-center rounded-lg border border-transparent bg-blue-600 py-3 px-4 text-sm font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition"
            >
              Daftar
            </button>
          </div>
          <p class="text-center text-sm text-gray-600">
            Sudah punya akun?
            <a
              href="login.html"
              class="text-blue-600 hover:text-blue-500 font-medium"
              >Masuk</a
            >
          </p>
        </form>
      </div>
      <a
        href="https://wa.me/"
        target="_blank"
        class="fixed bottom-6 right-6 p-3 rounded-xl bg-blue-500 text-white text-sm font-semibold shadow-xl hover:bg-blue-600 transition duration-300 ease-in-out z-20 flex items-center space-x-2"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          fill="currentColor"
          class="bi bi-whatsapp"
          viewBox="0 0 16 16"
        >
          <path
            d="M13.601 2.326A7.85 7.85 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.9 7.9 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.9 7.9 0 0 0 13.6 2.326zM7.994 14.521a6.6 6.6 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.56 6.56 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592m3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.73.73 0 0 0-.529.247c-.182.198-.691.677-.691 1.654s.71 1.916.81 2.049c.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232"
          />
        </svg>
        <span>Help Desk WhatsApp</span>
      </a>
    </div>
    <script src="../asset/index.js"></script>
    <script>
      initializePasswordToggle("password", "togglePasswordIcon");
      initializePasswordToggle("confirm_password", "toggleConfirmPasswordIcon");
    </script>
  </body>
</html>
